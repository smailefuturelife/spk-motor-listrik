<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .login-card {
      width: 300px;
    }

    @media (max-width: 576px) {
      .login-card {
        width: 90%;
        max-width: 400px;
      }

      .login-card h4 {
        font-size: 26px;
      }

      .form-control {
        height: 50px;
        font-size: 16px;
      }

      .btn {
        height: 50px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body class="bg-dark d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow login-card">
  <h4 class="text-center mb-3">Login SPK</h4>

  <div class="alert alert-info py-2 mb-3">
    <small>
      <b>Akun Demo</b><br>
      Username: <b>admin@gmail.com</b><br>
      Password: <b>123</b>
    </small>
  </div>

  <input id="user" class="form-control mb-2" placeholder="Username">
  <input id="pass" type="password" class="form-control mb-3" placeholder="Password">

  <button onclick="login()" class="btn btn-primary w-100">Login</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
