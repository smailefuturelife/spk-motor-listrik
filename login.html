<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SPK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
            font-family:Arial, sans-serif;
            padding:15px;
        }

        .login-card{
            width:100%;
            max-width:420px;
            border:none;
            border-radius:20px;
            padding:30px;
            background:white;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        .logo{
            width:90px;
            height:90px;
            background:#0d6efd;
            color:white;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:auto;
            font-size:40px;
            margin-bottom:15px;
        }

        .title{
            text-align:center;
            font-weight:bold;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:gray;
            margin-bottom:20px;
        }

        .demo-account{
            background:#e7f1ff;
            border-left:5px solid #0d6efd;
            padding:12px;
            border-radius:10px;
            margin-bottom:15px;
            font-size:14px;
        }

        .form-control{
            height:50px;
            border-radius:10px;
        }

        .btn-login{
            height:50px;
            border-radius:10px;
            font-weight:bold;
            font-size:17px;
        }

        .btn-demo{
            border-radius:10px;
            margin-bottom:15px;
        }

        #loading{
            display:none;
        }

        @media(max-width:576px){
            .login-card{
                padding:25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            🔐
        </div>

        <h3 class="title">Login SPK</h3>
        <p class="subtitle">Silakan login untuk melanjutkan</p>

        <div class="demo-account">
            <strong>🔑 Akun Demo</strong><br>
            Username : <b>admin@gmail.com</b><br>
            Password : <b>123</b>
        </div>

        <button
            type="button"
            class="btn btn-outline-primary w-100 btn-demo"
            onclick="isiDemo()">
            Isi Akun Demo
        </button>

        <div class="mb-3">
            <input
                type="text"
                id="user"
                class="form-control"
                placeholder="Masukkan Username">
        </div>

        <div class="mb-3">
            <input
                type="password"
                id="pass"
                class="form-control"
                placeholder="Masukkan Password">
        </div>

        <button
            onclick="login()"
            class="btn btn-primary btn-login w-100">

            <span id="btnText">Login</span>
            <span id="loading" class="spinner-border spinner-border-sm"></span>

        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/auth.js"></script>

</body>
</html>
